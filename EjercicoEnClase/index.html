<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercico en Clase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div class="fecha">
                <div class="numero"> 
                    11
                </div>
                <div class="mes">
                    <h2>Sept</h2>
                    <p>2021</p>
                </div>
            </div>
            <div class="dia">
                SABADO
            </div>
        </div>
        <div class="acciones">
            <button class="nueva-tarea">
                Nueva tarea
            </button>
            <button class="circulo">
                +
            </button>
            <button class="ordenar">
                ordenar
            </button>
        </div>
        <br>
        <div class="lista">
            <button class="tarea">
                Salir a caminar
            </button>

            <button class="tarea">
                Comprar jabon
            </button>

            <button class="tarea completada">
                Hacer ejercicio
            </button>
            
        </div>
    </div>
</body>
</html>
